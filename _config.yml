# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
lang: zh-CN

# Change to your timezone › https://zones.arilyn.cc
timezone: Asia/Shanghai

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: 杰克极客园 # the main title

tagline: Jack的个人博客 # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  杰克极客园 | Jack's Geek Park：音视频、智能硬件、Homelab 与 AI 折腾记录。

# Fill in the protocol & hostname for your site.
url: "https://wuwei.me"

github:
  username: jackwuwei

social:
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Jack
  email: jackwu8203@gmail.com
  links:
    # The first element serves as the copyright owner's link
    - https://github.com/jackwuwei
    - https://www.facebook.com/jack.wuwei

# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:

# Page views settings
pageviews:
  provider: # now only supports 'goatcounter'

# Keep empty to follow the system color scheme, with a toggle in the sidebar.
theme_mode: # [light | dark]

# The CDN endpoint for media resources.
cdn:

# the avatar on sidebar, support local or CORS resources
avatar: /img/avatar-jack.jpg

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
social_preview_image: /img/post-bg-2015.jpg

# boolean type, the global switch for TOC in posts.
toc: true

actions:
  edit_post:
    enabled: false

comments:
  # Global switch for the post-comment system. Keeping it empty means disabled.
  provider: # [disqus | utterances | giscus]
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true # The option for PWA feature (installable)
  cache:
    enabled: false # The option for PWA offline cache
    deny_paths:

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # Keep the URLs of the old Hux Blog theme (`permalink: pretty`) so existing links still work.
      permalink: /:year/:month/:day/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
